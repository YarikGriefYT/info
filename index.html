<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Безликий | Био-ссылки</title>
  <!-- Иконки FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Шрифты -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('https://images.unsplash.com/photo-1543852786-1cf6624b9987?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      padding: 20px;
      position: relative;
    }

    /* Анимированный оверлей с частицами */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 95, 109, 0.05) 0%, transparent 70%);
      animation: pulseGlow 4s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }

    .container {
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
    }

    /* Карточка профиля */
    .profile-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .profile-card:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    }

    /* Аватарка — ссылка */
    .avatar-link {
      display: block;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      flex-shrink: 0;
      overflow: hidden;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    .avatar-link::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FF9068, #FF5F6D, #D16BA5);
      z-index: -1;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .avatar-link:hover {
      transform: scale(1.08);
      border-color: #FF5F6D;
      box-shadow: 0 0 25px rgba(255, 95, 109, 0.4);
    }

    .avatar-link:hover::before {
      opacity: 1;
    }

    .avatar-link img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Текст профиля */
    .profile-text-link {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }

    .profile-text-link:hover {
      transform: translateX(4px);
    }

    .profile-text-link h1 {
      color: #ffffff;
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.2;
      background: linear-gradient(135deg, #ffffff 0%, #FF9068 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .profile-text-link .username {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
      font-weight: 400;
      margin-top: 2px;
      transition: color 0.3s ease;
    }

    .profile-text-link:hover .username {
      color: rgba(255, 255, 255, 0.9);
    }

    /* Сетка кнопок */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .link-item {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 18px 0;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      color: white;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .link-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .link-item:hover::before {
      opacity: 1;
    }

    .link-item:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .link-item:active {
      transform: scale(0.96);
    }

    .link-item i {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #ffffff;
      transition: transform 0.3s ease;
    }

    .link-item:hover i {
      transform: scale(1.2);
    }

    .link-item span {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .link-item.telegram i { color: #2AABEE; }
    .link-item.vk i { color: #4A76A8; }
    .link-item.youtube i { color: #FF0000; }

    /* Анимированная кнопка YouTube */
    .link-item.youtube {
      background: linear-gradient(135deg, rgba(255, 0, 0, 0.15), rgba(255, 0, 0, 0.05));
      border-color: rgba(255, 0, 0, 0.2);
    }

    .link-item.youtube:hover {
      background: linear-gradient(135deg, rgba(255, 0, 0, 0.25), rgba(255, 0, 0, 0.1));
      border-color: #FF0000;
      box-shadow: 0 10px 30px rgba(255, 0, 0, 0.3);
    }

    .link-item.youtube i {
      animation: pulse 2s ease-in-out infinite;
    }

    .link-item.youtube:hover i {
      animation: pulse 0.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* Блок "Проекты" */
    .projects-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .projects-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 144, 104, 0.1), rgba(255, 95, 109, 0.1));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .projects-card:hover::before {
      opacity: 1;
    }

    .projects-card:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 144, 104, 0.4);
    }

    .projects-card i {
      font-size: 1.8rem;
      color: white;
      transition: transform 0.3s ease;
    }

    .projects-card:hover i {
      transform: rotate(20deg) scale(1.1);
    }

    .projects-card .info h3 {
      font-size: 1rem;
      font-weight: 600;
    }

    .projects-card .info p {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.6);
    }

    /* YouTube кнопка внизу (активная, красивая) */
    .youtube-full {
      border-radius: 24px;
      padding: 16px;
      flex-direction: row;
      gap: 12px;
      justify-content: center;
      margin-top: 16px;
      width: 100%;
      background: linear-gradient(135deg, rgba(255, 0, 0, 0.15), rgba(255, 0, 0, 0.05));
      border: 1px solid rgba(255, 0, 0, 0.2);
      text-decoration: none;
      display: flex;
      align-items: center;
      color: white;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .youtube-full::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 0, 0, 0.2), rgba(255, 0, 0, 0.05));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .youtube-full:hover::before {
      opacity: 1;
    }

    .youtube-full:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 30px rgba(255, 0, 0, 0.3);
      border-color: #FF0000;
    }

    .youtube-full:active {
      transform: scale(0.96);
    }

    .youtube-full i {
      font-size: 1.8rem;
      color: #FF0000;
      animation: pulse 2s ease-in-out infinite;
      transition: transform 0.3s ease;
    }

    .youtube-full:hover i {
      animation: pulse 0.8s ease-in-out infinite;
    }

    .youtube-full span {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    @media (max-width: 380px) {
      .profile-text-link h1 { font-size: 1.4rem; }
      .avatar-link { width: 60px; height: 60px; }
      .grid-container { gap: 8px; }
      .link-item { padding: 14px 0; }
      .link-item i { font-size: 1.5rem; }
    }

    /* Экран старта */
    #start-screen {
      position: fixed;
      inset: 0;
      background: #0b0b0b;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: pointer;
      transition: opacity 0.6s ease;
    }

    #start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .start-content {
      text-align: center;
      animation: fadeInUp 0.8s ease;
    }

    .start-content h2 {
      color: white;
      font-size: 1.2rem;
      font-weight: 500;
      opacity: 0.8;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Плавающие частицы (декоративные) */
    .particle {
      position: fixed;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: float 15s infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
      50% { transform: translateY(-100px) rotate(180deg); opacity: 0.8; }
    }
  </style>
</head>
<body>

<!-- Декоративные частицы -->
<div class="particle" style="left: 10%; top: 20%; animation-delay: 0s;"></div>
<div class="particle" style="left: 30%; top: 60%; animation-delay: 2s;"></div>
<div class="particle" style="left: 70%; top: 30%; animation-delay: 4s;"></div>
<div class="particle" style="left: 85%; top: 70%; animation-delay: 6s;"></div>
<div class="particle" style="left: 50%; top: 10%; animation-delay: 8s;"></div>

<!-- Экран "Нажми, чтобы войти" -->
<div id="start-screen">
  <div class="start-content">
    <h2>Нажми, чтобы войти</h2>
  </div>
</div>

<!-- Скрытый аудиоплеер с вашей песней -->
<audio id="bg-music" loop preload="auto">
  <source src="ltzyarik.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <!-- Профиль -->
  <div class="profile-card">
    <!-- Аватарка-кнопка -->
    <a href="https://t.me/kirismall" target="_blank" class="avatar-link">
      <img src="https://i.pinimg.com/280x280_RS/9c/59/f1/9c59f1aaafc6c23c89d2a2b9f600b384.jpg" alt="Безликий">
    </a>

    <!-- Ник и юзернейм теперь тоже ссылка на t.me/kirismall -->
    <a href="https://t.me/kirismall" target="_blank" class="profile-text-link">
      <h1>Безликий</h1>
      <div class="username">@kirismall</div>
    </a>
  </div>

  <!-- Сетка соцсетей -->
  <div class="grid-container">
    <!-- ТГК (Telegram канал) -->
    <a href="https://t.me/news_yarik" target="_blank" class="link-item telegram">
      <i class="fab fa-telegram"></i>
      <span>тгк</span>
    </a>

    <!-- ВК -->
    <a href="https://vk.com/show_yarik" target="_blank" class="link-item vk">
      <i class="fab fa-vk"></i>
      <span>вк</span>
    </a>
  </div>

  <!-- Проекты -->
  <a href="https://t.me/projectsyarikru" target="_blank" class="projects-card">
    <i class="fas fa-code-branch"></i>
    <div class="info">
      <h3>проекты</h3>
      <p>посмотри мои последние проекты</p>
    </div>
  </a>

  <!-- YouTube - теперь активная ссылка -->
  <a href="https://youtube.com/@ltz_yarik?si=LVGcTWqQJEInBW74" target="_blank" class="youtube-full">
    <i class="fab fa-youtube"></i>
    <span>YouTube</span>
  </a>
</div>

<script>
  const startScreen = document.getElementById('start-screen');
  const audio = document.getElementById('bg-music');

  startScreen.addEventListener('click', () => {
    startScreen.classList.add('hidden');

    // Запускаем музыку после клика
    if (audio) {
      audio.play().catch((error) => {
        console.log('Ошибка воспроизведения:', error);
      });
    }
  });
</script>

</body>
</html>
