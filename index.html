<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Безликий | Био-ссылки</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    /* ===== ЖЁЛТЫЙ КУРСОР С ЭФФЕКТОМ ===== */
    html {
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 36 36'><circle cx='18' cy='18' r='14' fill='rgba(255,215,0,0.2)' stroke='%23FFD700' stroke-width='2.5'/><circle cx='18' cy='18' r='5' fill='%23FFD700'/><circle cx='18' cy='18' r='16' fill='none' stroke='rgba(255,215,0,0.3)' stroke-width='1' stroke-dasharray='4 4'/></svg>") 18 18, auto;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('35f696dd807103ed5194e4d64dba8bef.jpg') no-repeat center center fixed;
      background-size: cover;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 70%);
      animation: pulseGlow 4s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.1); }
    }

    .container {
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
    }

    .animate-item {
      opacity: 0;
      transform: translateY(40px) scale(0.95);
      transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .animate-item.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .delay-1 { transition-delay: 0.1s; }
    .delay-2 { transition-delay: 0.2s; }
    .delay-3 { transition-delay: 0.3s; }
    .delay-4 { transition-delay: 0.4s; }
    .delay-5 { transition-delay: 0.5s; }
    .delay-6 { transition-delay: 0.6s; }
    .delay-7 { transition-delay: 0.7s; }
    .delay-8 { transition-delay: 0.8s; }

    .profile-link {
      display: block;
      text-decoration: none;
      color: inherit;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 215, 0, 0.15);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 16px;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 215, 0, 0.1);
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transform: perspective(800px) rotateX(0deg) rotateY(0deg);
    }

    .profile-link:hover {
      background: rgba(0, 0, 0, 0.6);
      transform: perspective(800px) rotateX(2deg) rotateY(4deg) translateY(-4px) scale(1.02);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 215, 0, 0.05), inset 0 1px 0 rgba(255, 215, 0, 0.2);
      border-color: rgba(255, 215, 0, 0.3);
    }

    .profile-link:active {
      transform: perspective(800px) rotateX(0deg) rotateY(0deg) scale(0.96);
    }

    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid rgba(255, 215, 0, 0.3);
      flex-shrink: 0;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .avatar:hover {
      transform: scale(1.08) rotate(4deg);
      border-color: #FFD700;
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-info h1 {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.2;
      background: linear-gradient(135deg, #8B5CF6 0%, #D946EF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile-info .username {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9rem;
      font-weight: 400;
      margin-top: 2px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .link-item {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 215, 0, 0.1);
      border-radius: 20px;
      padding: 18px 0;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: white;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 215, 0, 0.05);
      transform: perspective(600px) rotateX(0deg) rotateY(0deg);
    }

    .link-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 215, 0, 0));
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .link-item:hover::before {
      opacity: 1;
    }

    .link-item:hover {
      background: rgba(0, 0, 0, 0.6);
      transform: perspective(600px) rotateX(2deg) rotateY(3deg) translateY(-4px) scale(1.03);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 215, 0, 0.08);
      border-color: rgba(255, 215, 0, 0.25);
    }

    .link-item:active {
      transform: perspective(600px) rotateX(0deg) rotateY(0deg) scale(0.94);
    }

    .link-item i {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #ffffff;
      transition: all 0.4s ease;
    }

    .link-item:hover i {
      transform: scale(1.2) rotate(4deg);
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .link-item span {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .link-item.telegram i { color: #2AABEE; }
    .link-item.vk i { color: #4A76A8; }
    .link-item.tiktok i { color: #FF0050; }
    .link-item.youtube i { color: #FF0000; }

    .projects-card {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 215, 0, 0.1);
      border-radius: 24px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-decoration: none;
      color: white;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 215, 0, 0.05);
      transform: perspective(600px) rotateX(0deg) rotateY(0deg);
    }

    .projects-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 200, 100, 0.05));
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .projects-card:hover::before {
      opacity: 1;
    }

    .projects-card:hover {
      background: rgba(0, 0, 0, 0.6);
      transform: perspective(600px) rotateX(2deg) rotateY(3deg) translateY(-4px) scale(1.02);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5), 0 0 25px rgba(255, 215, 0, 0.08);
      border-color: rgba(255, 215, 0, 0.3);
    }

    .projects-card i {
      font-size: 1.8rem;
      color: white;
      transition: all 0.4s ease;
    }

    .projects-card:hover i {
      transform: rotate(20deg) scale(1.15);
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .projects-card .info h3 {
      font-size: 1rem;
      font-weight: 600;
    }

    .projects-card .info p {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.6);
    }

    .server-card {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 24px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-decoration: none;
      color: white;
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 215, 0, 0.05);
      transform: perspective(600px) rotateX(0deg) rotateY(0deg);
    }

    .server-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 165, 0, 0.05));
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .server-card:hover::before {
      opacity: 1;
    }

    .server-card:hover {
      background: rgba(0, 0, 0, 0.6);
      transform: perspective(600px) rotateX(2deg) rotateY(3deg) translateY(-4px) scale(1.02);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 215, 0, 0.1);
      border-color: rgba(255, 215, 0, 0.5);
    }

    .server-card i {
      font-size: 1.8rem;
      color: #FFD700;
      transition: all 0.4s ease;
    }

    .server-card:hover i {
      transform: rotate(15deg) scale(1.1);
      text-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
    }

    .server-card .info h3 {
      font-size: 1rem;
      font-weight: 600;
      color: #FFD700;
    }

    .server-card .info p {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.7);
    }

    .ip-badge {
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 12px;
      padding: 4px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #FFD700;
      display: inline-block;
      margin-top: 4px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .ip-badge:hover {
      background: rgba(255, 215, 0, 0.25);
      transform: scale(1.05);
    }

    .ip-badge.copied {
      background: rgba(0, 255, 100, 0.2);
      border-color: rgba(0, 255, 100, 0.3);
      color: #00FF64;
    }

    .youtube-full {
      border-radius: 24px;
      padding: 16px;
      flex-direction: row;
      gap: 12px;
      justify-content: center;
      margin-top: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 0, 0, 0.2);
      text-decoration: none;
      display: flex;
      align-items: center;
      color: white;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 0, 0, 0.05);
      transform: perspective(600px) rotateX(0deg) rotateY(0deg);
    }

    .youtube-full::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 0, 0, 0.2), rgba(255, 0, 0, 0.05));
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .youtube-full:hover::before {
      opacity: 1;
    }

    .youtube-full:hover {
      transform: perspective(600px) rotateX(2deg) rotateY(3deg) translateY(-4px) scale(1.02);
      box-shadow: 0 12px 36px rgba(255, 0, 0, 0.3), 0 0 25px rgba(255, 0, 0, 0.15);
      border-color: #FF0000;
    }

    .youtube-full:active {
      transform: perspective(600px) rotateX(0deg) rotateY(0deg) scale(0.94);
    }

    .youtube-full i {
      font-size: 1.8rem;
      color: #FF0000;
      animation: pulse 2s ease-in-out infinite;
      transition: all 0.4s ease;
    }

    .youtube-full:hover i {
      animation: pulse 0.8s ease-in-out infinite;
      transform: scale(1.15);
    }

    .youtube-full span {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* ===== ВИЗУАЛИЗАТОР (ваш CSS) ===== */
    #vizBar {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 40px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    #vizBar.visible {
      opacity: 1;
    }

    .bar-col {
      width: 8px;
      height: 6px;
      border-radius: 999px;
      transition: height 0.08s linear, opacity 0.12s ease;
    }

    @media (max-width: 480px) {
      #vizBar {
        width: 320px;
        height: 30px;
        gap: 3px;
        bottom: 20px;
      }
      .bar-col {
        width: 6px;
      }
    }

    @media (max-width: 380px) {
      #vizBar {
        width: 260px;
        height: 25px;
        gap: 2px;
        bottom: 15px;
      }
      .bar-col {
        width: 5px;
      }
    }

    /* ===== ЭКРАН ЗАГРУЗКИ ===== */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0b0b0b;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      animation: fadeInUp 0.8s ease;
    }

    .loading-content h2 {
      color: white;
      font-size: 1.2rem;
      font-weight: 500;
      opacity: 0.8;
    }

    .loader {
      display: inline-block;
      position: relative;
      width: 80px;
      height: 80px;
    }

    .loader div {
      box-sizing: border-box;
      display: block;
      position: absolute;
      width: 64px;
      height: 64px;
      margin: 8px;
      border: 4px solid #FFD700;
      border-radius: 50%;
      animation: loader-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      border-color: #FFD700 transparent transparent transparent;
    }

    .loader div:nth-child(1) {
      animation-delay: -0.45s;
    }

    .loader div:nth-child(2) {
      animation-delay: -0.3s;
    }

    .loader div:nth-child(3) {
      animation-delay: -0.15s;
    }

    .loader div:nth-child(4) {
      animation-delay: 0s;
    }

    @keyframes loader-ring {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      color: rgba(255, 215, 0, 0.6);
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      animation: fadeText 1.5s ease-in-out infinite;
    }

    @keyframes fadeText {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* ===== ЭКРАН ВХОДА ===== */
    #enter-screen {
      position: fixed;
      inset: 0;
      background: rgba(11, 11, 11, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      cursor: pointer;
      transition: opacity 0.6s ease;
    }

    #enter-screen.visible {
      display: flex;
    }

    #enter-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .enter-content {
      text-align: center;
      animation: fadeInUp 0.8s ease;
    }

    .enter-content h2 {
      color: #8B5CF6;
      font-size: 1.4rem;
      font-weight: 500;
      opacity: 0.9;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

<script>
  const loadingScreen = document.getElementById('loading-screen');
  const enterScreen = document.getElementById('enter-screen');
  const animatedItems = document.querySelectorAll('.animate-item');
  const vizBar = document.getElementById('vizBar');

  // ================================
  // ЗАГРУЗКА → ЭКРАН ВХОДА
  // ================================
  setTimeout(() => {
    loadingScreen.classList.add('hidden');
    enterScreen.classList.add('visible');
  }, 3000);

  // ================================
  // КЛИК НА ЭКРАН ВХОДА
  // ================================
  enterScreen.addEventListener('click', () => {
    enterScreen.classList.add('hidden');

    // Активируем анимацию появления элементов
    animatedItems.forEach((item, index) => {
      setTimeout(() => {
        item.classList.add('visible');
      }, 100 + (index * 100));
    });

    // Показываем визуализатор
    setTimeout(() => {
      vizBar.classList.add('visible');
    }, 500);
  });

  // ================================
  // КОПИРОВАНИЕ IP
  // ================================
  function copyIP(event) {
    event.stopPropagation();
    const ip = 'yarik.ezhikmine.ru';
    
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ip).then(() => {
        showCopiedFeedback();
      }).catch(() => {
        fallbackCopy(ip);
      });
    } else {
      fallbackCopy(ip);
    }
  }

  function fallbackCopy(text) {
    const textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed';
    textArea.style.opacity = '0';
    document.body.appendChild(textArea);
    textArea.select();
    try {
      document.execCommand('copy');
      showCopiedFeedback();
    } catch (err) {
      console.error('Ошибка копирования:', err);
    }
    document.body.removeChild(textArea);
  }

  function showCopiedFeedback() {
    const badge = document.getElementById('ip-copy');
    const originalText = badge.innerHTML;
    badge.innerHTML = '<i class="fas fa-check" style="font-size:0.7rem; margin-right:4px;"></i> скопировано!';
    badge.classList.add('copied');
    setTimeout(() => {
      badge.innerHTML = originalText;
      badge.classList.remove('copied');
    }, 2000);
  }
</script>

<!-- ===== ВАШ ВИЗУАЛИЗАТОР ===== -->
<script>
  const audio = new Audio('ss6.mp3');
  audio.loop = true;

  const ctx = new AudioContext();
  const src = ctx.createMediaElementSource(audio);

  const analyser = ctx.createAnalyser();
  analyser.fftSize = 256;

  src.connect(analyser);
  analyser.connect(ctx.destination);

  const dataArray = new Uint8Array(analyser.frequencyBinCount);

  document.addEventListener('click', async () => {
    await ctx.resume();
    audio.play();
  }, { once: true });

  const vizBar = document.getElementById('vizBar');

  const BAR_N = 32;
  const barEls = [];

  for (let i = 0; i < BAR_N; i++) {
    const el = document.createElement('div');

    el.className = 'bar-col';

    const t = i / (BAR_N - 1);

    const r = Math.round(80 + t * 80);
    const g = Math.round(40 + t * 60);
    const b = Math.round(180 + t * 75);

    el.style.background = `rgb(${r},${g},${b})`;
    el.style.boxShadow = `0 0 6px rgba(${r},${g},${b},0.6)`;

    vizBar.appendChild(el);
    barEls.push(el);
  }

  function updateBars() {
    requestAnimationFrame(updateBars);

    analyser.getByteFrequencyData(dataArray);

    for (let i = 0; i < BAR_N; i++) {
      const idx = (i / BAR_N * dataArray.length) | 0;

      const value = dataArray[idx] / 255;

      const height = 4 + value * 32;

      barEls[i].style.height = height + 'px';
      barEls[i].style.opacity = 0.4 + value;
    }
  }

  updateBars();
</script>
