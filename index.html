<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Безликий | Био-ссылки</title>
  <!-- Иконки FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Шрифты -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      /* Курсор — кружок */
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='rgba(255,215,0,0.15)' stroke='%23FFD700' stroke-width='2.5'/><circle cx='16' cy='16' r='6' fill='%23FFD700'/></svg>") 16 16, auto;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('35f696dd807103ed5194e4d64dba8bef.jpg') no-repeat center center fixed;
      background-size: cover;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 200, 100, 0.05) 0%, transparent 70%);
      animation: pulseGlow 4s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }

    .container {
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
    }

    /* Анимация появления элементов */
    .animate-item {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .animate-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Задержки для последовательного появления */
    .delay-1 { transition-delay: 0.1s; }
    .delay-2 { transition-delay: 0.2s; }
    .delay-3 { transition-delay: 0.3s; }
    .delay-4 { transition-delay: 0.4s; }
    .delay-5 { transition-delay: 0.5s; }
    .delay-6 { transition-delay: 0.6s; }

    /* Вся карточка профиля — одна ссылка */
    .profile-link {
      display: block;
      text-decoration: none;
      color: inherit;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
    }

    .profile-link:hover {
      background: rgba(0, 0, 0, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }

    .profile-link:active {
      transform: scale(0.98);
    }

    /* Аватарка */
    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      flex-shrink: 0;
      overflow: hidden;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .avatar:hover {
      transform: scale(1.05);
      border-color: #FFD700;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Текст профиля */
    .profile-info {
      display: flex;
      flex-direction: column;
    }

    .profile-info h1 {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.2;
      /* Фиолетовый градиент */
      background: linear-gradient(135deg, #8B5CF6 0%, #D946EF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile-info .username {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9rem;
      font-weight: 400;
      margin-top: 2px;
    }

    /* Сетка кнопок */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .link-item {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 18px 0;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      color: white;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .link-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .link-item:hover::before {
      opacity: 1;
    }

    .link-item:hover {
      background: rgba(0, 0, 0, 0.5);
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .link-item:active {
      transform: scale(0.96);
    }

    .link-item i {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #ffffff;
      transition: transform 0.3s ease;
    }

    .link-item:hover i {
      transform: scale(1.2);
    }

    .link-item span {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .link-item.telegram i { color: #2AABEE; }
    .link-item.vk i { color: #4A76A8; }
    .link-item.tiktok i { color: #FF0050; }
    .link-item.youtube i { color: #FF0000; }

    /* Блок "Проекты" */
    .projects-card {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .projects-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 200, 100, 0.1), rgba(255, 150, 50, 0.1));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .projects-card:hover::before {
      opacity: 1;
    }

    .projects-card:hover {
      background: rgba(0, 0, 0, 0.5);
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      border-color: rgba(255, 200, 100, 0.4);
    }

    .projects-card i {
      font-size: 1.8rem;
      color: white;
      transition: transform 0.3s ease;
    }

    .projects-card:hover i {
      transform: rotate(20deg) scale(1.1);
    }

    .projects-card .info h3 {
      font-size: 1rem;
      font-weight: 600;
    }

    .projects-card .info p {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.6);
    }

    /* YouTube кнопка внизу */
    .youtube-full {
      border-radius: 24px;
      padding: 16px;
      flex-direction: row;
      gap: 12px;
      justify-content: center;
      margin-top: 16px;
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 0, 0, 0.2);
      text-decoration: none;
      display: flex;
      align-items: center;
      color: white;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .youtube-full::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 0, 0, 0.2), rgba(255, 0, 0, 0.05));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .youtube-full:hover::before {
      opacity: 1;
    }

    .youtube-full:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 30px rgba(255, 0, 0, 0.3);
      border-color: #FF0000;
    }

    .youtube-full:active {
      transform: scale(0.96);
    }

    .youtube-full i {
      font-size: 1.8rem;
      color: #FF0000;
      animation: pulse 2s ease-in-out infinite;
      transition: transform 0.3s ease;
    }

    .youtube-full:hover i {
      animation: pulse 0.8s ease-in-out infinite;
    }

    .youtube-full span {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* Кнопка управления музыкой */
    .music-control {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      color: white;
      font-size: 1.4rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .music-control:hover {
      background: rgba(0, 0, 0, 0.7);
      transform: scale(1.1);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .music-control:active {
      transform: scale(0.9);
    }

    .music-control.muted {
      background: rgba(255, 0, 0, 0.2);
      border-color: rgba(255, 0, 0, 0.3);
    }

    .music-control.muted i {
      color: #FF5F6D;
    }

    @media (max-width: 380px) {
      .profile-info h1 { font-size: 1.4rem; }
      .avatar { width: 60px; height: 60px; }
      .grid-container { gap: 8px; }
      .link-item { padding: 14px 0; }
      .link-item i { font-size: 1.5rem; }
      .music-control {
        width: 44px;
        height: 44px;
        font-size: 1.2rem;
        bottom: 15px;
        right: 15px;
      }
    }

    /* Экран старта */
    #start-screen {
      position: fixed;
      inset: 0;
      background: #0b0b0b;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: pointer;
      transition: opacity 0.6s ease;
    }

    #start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .start-content {
      text-align: center;
      animation: fadeInUp 0.8s ease;
    }

    .start-content h2 {
      color: white;
      font-size: 1.2rem;
      font-weight: 500;
      opacity: 0.8;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

<!-- Экран "Нажми, чтобы войти" -->
<div id="start-screen">
  <div class="start-content">
    <h2>Нажми, чтобы войти</h2>
  </div>
</div>

<!-- Скрытый аудиоплеер с вашей песней -->
<audio id="bg-music" loop preload="auto">
  <source src="ss7.mp3" type="audio/mpeg">
</audio>

<!-- Кнопка управления музыкой -->
<div class="music-control" id="music-toggle" title="Вкл/Выкл музыку">
  <i class="fas fa-music"></i>
</div>

<div class="container">
  <!-- Профиль -->
  <a href="https://t.me/kirismall" target="_blank" class="profile-link animate-item delay-1" id="profile-item">
    <div class="avatar">
      <img src="https://i.pinimg.com/280x280_RS/9c/59/f1/9c59f1aaafc6c23c89d2a2b9f600b384.jpg" alt="Безликий">
    </div>
    <div class="profile-info">
      <h1>Безликий</h1>
      <div class="username">@kirismall</div>
    </div>
  </a>

  <!-- Сетка соцсетей -->
  <div class="grid-container">
    <a href="https://t.me/news_yarik" target="_blank" class="link-item telegram animate-item delay-2" id="tgk-item">
      <i class="fab fa-telegram"></i>
      <span>тгк</span>
    </a>

    <a href="https://tiktok.com/@ltz_yarik" target="_blank" class="link-item tiktok animate-item delay-3" id="tiktok-item">
      <i class="fab fa-tiktok"></i>
      <span>тикток</span>
    </a>

    <a href="https://vk.com/show_yarik" target="_blank" class="link-item vk animate-item delay-4" id="vk-item">
      <i class="fab fa-vk"></i>
      <span>вк</span>
    </a>
  </div>

  <!-- Проекты -->
  <a href="https://t.me/projectsyarikru" target="_blank" class="projects-card animate-item delay-5" id="projects-item">
    <i class="fas fa-code-branch"></i>
    <div class="info">
      <h3>проекты</h3>
      <p>посмотри мои последние проекты</p>
    </div>
  </a>

  <!-- YouTube -->
  <a href="https://youtube.com/@ltz_yarik?si=LVGcTWqQJEInBW74" target="_blank" class="youtube-full animate-item delay-6" id="youtube-item">
    <i class="fab fa-youtube"></i>
    <span>YouTube</span>
  </a>
</div>

<script>
  const startScreen = document.getElementById('start-screen');
  const audio = document.getElementById('bg-music');
  const musicToggle = document.getElementById('music-toggle');

  // Элементы для анимации
  const animatedItems = document.querySelectorAll('.animate-item');

  startScreen.addEventListener('click', () => {
    startScreen.classList.add('hidden');

    // Запускаем музыку
    if (audio) {
      audio.play().then(() => {
        musicToggle.innerHTML = '<i class="fas fa-music"></i>';
        musicToggle.classList.remove('muted');
      }).catch((error) => {
        console.log('Ошибка воспроизведения:', error);
      });
    }

    // Активируем анимацию появления элементов
    animatedItems.forEach((item, index) => {
      setTimeout(() => {
        item.classList.add('visible');
      }, 100 + (index * 100)); // Каждый следующий элемент появляется на 100мс позже
    });
  });

  musicToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    
    if (audio.paused) {
      audio.play().then(() => {
        musicToggle.innerHTML = '<i class="fas fa-music"></i>';
        musicToggle.classList.remove('muted');
      }).catch((error) => {
        console.log('Ошибка воспроизведения:', error);
      });
    } else {
      audio.pause();
      musicToggle.innerHTML = '<i class="fas fa-volume-mute"></i>';
      musicToggle.classList.add('muted');
    }
  });

  audio.addEventListener('pause', () => {
    if (!audio.paused) return;
    musicToggle.innerHTML = '<i class="fas fa-volume-mute"></i>';
    musicToggle.classList.add('muted');
  });

  audio.addEventListener('play', () => {
    musicToggle.innerHTML = '<i class="fas fa-music"></i>';
    musicToggle.classList.remove('muted');
  });
</script>

</body>
</html>
